<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="MINDMAP" height="931px" preserveAspectRatio="none" style="width:1089px;height:931px;background:#FFFFFF;" version="1.1" viewBox="0 0 1089 931" width="1089px" zoomAndPan="magnify"><defs/><g><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="178.1836" x="10" y="446.6797"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.1836" x="20" y="469.6748">Traverse Or Sub Task?</text><rect fill="#F1F1F1" height="52.5938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="280.5313" x="238.1836" y="292.6016"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.4482" x="248.1836" y="315.5967">Traverse</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.5313" x="248.1836" y="331.8936">Natrually similar as Backtrack or DFS</text><rect fill="#F1F1F1" height="248.1563" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="331.8623" x="568.7148" y="20"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.6172" x="578.7148" y="42.9951">Backtrack</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="227.5752" x="578.7148" y="59.292">//&#160;backtrack&#160;code&#160;framework</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="236.0039" x="578.7148" y="75.5889">func&#160;backtrack([]int&#160;nums)&#160;{</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="278.1475" x="612.4297" y="91.8857">for&#160;i&#160;:=&#160;0;&#160;i&#160;&lt;&#160;len(nums);&#160;i++)&#160;{</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="75.8584" x="646.1445" y="108.1826">//&#160;choose</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="118.002" x="646.1445" y="124.4795">used[i]&#160;=&#160;true</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="185.4316" x="646.1445" y="140.7764">track.addLast(nums[i])</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="646.1445" y="157.0732">//&#160;entry&#160;next&#160;layer</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="646.1445" y="173.3701">backtrack(nums)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="646.1445" y="189.667">//&#160;cancel&#160;choose</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="151.7168" x="646.1445" y="205.9639">track.removeLast()</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="646.1445" y="222.2607">used[i]&#160;=&#160;false</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="612.4297" y="238.5576">}</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="578.7148" y="254.8545">}</text><path d="M518.7148,318.8984 L528.7148,318.8984 C543.7148,318.8984 543.7148,144.0781 558.7148,144.0781 L568.7148,144.0781" fill="none" style="stroke:#181818;stroke-width:1;"/><rect fill="#F1F1F1" height="329.6406" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="508.8652" x="568.7148" y="288.1563"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="27.7197" x="578.7148" y="311.1514">DFS</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="143.2881" x="578.7148" y="327.4482">//&#160;Island&#160;Problem</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="488.8652" x="578.7148" y="343.7451">func&#160;dfs([][]int&#160;grid,&#160;i,&#160;j&#160;int)&#160;{&#160;//&#160;DFS&#160;coding&#160;framework</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="118.002" x="612.4297" y="360.042">m&#160;:=&#160;len(grid)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="612.4297" y="376.3389">n&#160;=&#160;len(grid[0])</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="345.5771" x="612.4297" y="392.6357">if&#160;(i&#160;&lt;&#160;0&#160;||&#160;j&#160;&lt;&#160;0&#160;||&#160;i&#160;&gt;=&#160;m&#160;||&#160;j&#160;&gt;=&#160;n)&#160;{</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="646.1445" y="408.9326">return</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="612.4297" y="425.2295">}</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="185.4316" x="612.4297" y="441.5264">if&#160;(grid[i][j]&#160;==&#160;0)&#160;{</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="646.1445" y="457.8232">return</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="612.4297" y="474.1201">}</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="185.4316" x="612.4297" y="490.417">//&#160;handle&#160;current&#160;node</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="118.002" x="612.4297" y="506.7139">grid[i][j]&#160;=&#160;0</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="612.4297" y="523.0107">//&#160;entry&#160;next&#160;layer</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="612.4297" y="539.3076">dfs(grid,&#160;i&#160;+&#160;1,&#160;j)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="612.4297" y="555.6045">dfs(grid,&#160;i,&#160;j&#160;+&#160;1)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="612.4297" y="571.9014">dfs(grid,&#160;i&#160;-&#160;1,&#160;j)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="612.4297" y="588.1982">dfs(grid,&#160;i,&#160;j&#160;-&#160;1)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="578.7148" y="604.4951">}</text><path d="M518.7148,318.8984 L528.7148,318.8984 C543.7148,318.8984 543.7148,452.9766 558.7148,452.9766 L568.7148,452.9766" fill="none" style="stroke:#181818;stroke-width:1;"/><path d="M188.1836,464.8281 L198.1836,464.8281 C213.1836,464.8281 213.1836,318.8984 228.1836,318.8984 L238.1836,318.8984" fill="none" style="stroke:#181818;stroke-width:1;"/><rect fill="#F1F1F1" height="52.5938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="321.0752" x="238.1836" y="747.4297"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.6289" x="248.1836" y="770.4248">Sub Task</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="301.0752" x="248.1836" y="786.7217">Natrually similar as Dynamic Programming</text><rect fill="#F1F1F1" height="215.5625" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="466.7217" x="609.2588" y="637.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.9922" x="619.2588" y="660.792">Dynaimic Programming</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="295.0049" x="619.2588" y="677.0889">//&#160;return&#160;the&#160;number&#160;of&#160;total&#160;nodes</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="177.0029" x="619.2588" y="693.3857">func&#160;fib(N&#160;int)&#160;int&#160;{</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="177.0029" x="652.9736" y="709.6826">if&#160;N&#160;==&#160;1&#160;||&#160;N&#160;==&#160;2&#160;{</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="67.4297" x="686.6885" y="725.9795">return&#160;1</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="652.9736" y="742.2764">}</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="413.0068" x="652.9736" y="758.5732">//&#160;resolve&#160;the&#160;problem&#160;by&#160;resolving&#160;the&#160;sub-trees</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="652.9736" y="774.8701">left&#160;:=&#160;fib(N-1)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="652.9736" y="791.167">right&#160;:=&#160;fib(N&#160;-&#160;2)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="185.4316" x="652.9736" y="807.4639">//&#160;post-order&#160;location</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="652.9736" y="823.7607">return&#160;left&#160;+&#160;right</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="619.2588" y="840.0576">}</text><path d="M559.2588,773.7266 L569.2588,773.7266 C584.2588,773.7266 584.2588,745.5781 599.2588,745.5781 L609.2588,745.5781" fill="none" style="stroke:#181818;stroke-width:1;"/><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="156.8486" x="609.2588" y="873.3594"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.8486" x="619.2588" y="896.3545">Divide and conquer</text><path d="M559.2588,773.7266 L569.2588,773.7266 C584.2588,773.7266 584.2588,891.5078 599.2588,891.5078 L609.2588,891.5078" fill="none" style="stroke:#181818;stroke-width:1;"/><path d="M188.1836,464.8281 L198.1836,464.8281 C213.1836,464.8281 213.1836,773.7266 228.1836,773.7266 L238.1836,773.7266" fill="none" style="stroke:#181818;stroke-width:1;"/><!--SRC=[VPHPSzem483VzIls4K98W6axBJcQIMawJSan9SaBamVPNeE2B54Tf4oI_zwLR0Cv6Z-0lRU-tTMHTTouGgYiu7F6jk3Ay0KQYt1XOEGJkE9szfKKM_sLXfrpPpoNSWbM549o0zp2CKzdpj0FQ0E3az5USDhghyHiFzKP7hBTNKXMfa44kU45tcipOxbNwLhR6DyAvK3vmZRX0HZGarDm0Vq3wEpH_pv8L8reG9-j5fb5g_1GddIgjSMLn5lCnk8M3e3ANujZhXsUPKDkNGn6HitDEAYSMOB2lmuaNw9PwTQbnXgUvUOgHVcoX3ANmK8lCAPhlb5TpcNbyiIUsFvkv5RX9B0R87zQoLK6bqOd4eiINvPR0bUYcnYHROFOXZkWpm2Hd2X4u2xKP8Dyo5O4hW5eS2iBKx2MZ3iL5P538x3lmECZHQvU11mUK8WeeZUrsGk3pXjL7QaE4MEAs_4TdPdw-QuzbJsbaqg4r1k3OIg8GLHjXe4EUwzb0Ks515hG9IpDb_A0YbIlvD3-ltqxs3zlLBzUdRTtPR1Kl11fQDo4Ma3hDwdxInhnGhNHy18Ck2c6jKZGWCx1QSTb16BB4SX5qZWlEnwcuA56VXv0TqEBubll5N7eFcTkq6gvm9XlNWuP9CjA70OeAAnFsiuW9GzU4dCNvYZMqAv06Z6PhgK4hDUiKyorTMrjCZgAr2btGfTzhmgAuLfbWDVB81Q2xe-m0gbMVporkKArjZj2kjhgw-sIriLTdmqXN6IK2RexlKxluywN11tlDgxLJEbxHS6AkQ1PSwB09clyk1o2rTwa29cmpeZ4XpARx9GlEFpsAjZruMAEwdJmgnR0TxKGHgk2Hf6Ttfoj3JvzQ1yB1oCqL0RSdB41vjnBHnxbNlRX-kga_PaDkPfuFg7OgDWtxSDCasxq3m00]--></g></svg>