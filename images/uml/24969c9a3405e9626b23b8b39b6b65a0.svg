<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="MINDMAP" height="379px" preserveAspectRatio="none" style="width:753px;height:379px;background:#FFFFFF;" version="1.1" viewBox="0 0 753 379" width="753px" zoomAndPan="magnify"><defs/><g><rect fill="#F1F1F1" height="36.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="114.6094" x="10" y="170.375"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.1592" x="20" y="193.3701">Pre Or Post ?</text><rect fill="#F1F1F1" height="101.4844" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="168.6475" x="174.6094" y="44.4453"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.8428" x="184.6094" y="67.4404">PreOrder</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.5195" x="184.6094" y="83.7373">Only have info of</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.4463" x="184.6094" y="100.0342">current node</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.8799" x="184.6094" y="116.3311">parents node</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.6475" x="184.6094" y="132.6279">But NO childre nodes</text><rect fill="#F1F1F1" height="150.375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="348.7197" x="393.2568" y="20"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.9736" x="403.2568" y="42.9951">Example - QuickSort</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="328.7197" x="403.2568" y="59.292">func&#160;sort(nums&#160;[]int,&#160;lo&#160;int,&#160;hi&#160;int)&#160;{</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="177.0029" x="436.9717" y="75.5889">//&#160;pre-order&#160;location</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="236.0039" x="436.9717" y="91.8857">p&#160;:=&#160;partition(nums,&#160;lo,&#160;hi)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="101.1445" x="436.9717" y="108.1826">//&#160;childrens</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="177.0029" x="436.9717" y="124.4795">sort(nums,&#160;lo,&#160;p&#160;-&#160;1)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="177.0029" x="436.9717" y="140.7764">sort(nums,&#160;p&#160;+&#160;1,&#160;hi)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="403.2568" y="157.0732">}</text><path d="M343.2568,95.1875 L353.2568,95.1875 C368.2568,95.1875 368.2568,95.1875 383.2568,95.1875 L393.2568,95.1875" fill="none" style="stroke:#181818;stroke-width:1;"/><path d="M124.6094,188.5234 L134.6094,188.5234 C149.6094,188.5234 149.6094,95.1875 164.6094,95.1875 L174.6094,95.1875" fill="none" style="stroke:#181818;stroke-width:1;"/><rect fill="#F1F1F1" height="101.4844" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="143.2861" x="174.6094" y="222.9688"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.8223" x="184.6094" y="245.9639">PostOrder</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.2861" x="184.6094" y="262.2607">Has all the info of</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.8965" x="184.6094" y="278.5576">current node,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.3301" x="184.6094" y="294.8545">parent nodes,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.1611" x="184.6094" y="311.1514">children nodes</text><rect fill="#F1F1F1" height="166.6719" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:1.5;" width="348.7197" x="367.8955" y="190.375"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.335" x="377.8955" y="213.3701">Example - MergeSort</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="328.7197" x="377.8955" y="229.667">func&#160;sort(nums&#160;[]int,&#160;lo&#160;int,&#160;hi&#160;int)&#160;{</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="168.5742" x="411.6104" y="245.9639">mid&#160;:=&#160;(lo&#160;+&#160;hi)&#160;/&#160;2</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="151.7168" x="411.6104" y="262.2607">//&#160;childrens&#160;first</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="411.6104" y="278.5576">sort(nums,&#160;lo,&#160;mid)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="193.8604" x="411.6104" y="294.8545">sort(nums,&#160;mid&#160;+&#160;1,&#160;hi)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="185.4316" x="411.6104" y="311.1514">//&#160;post-order&#160;location</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="202.2891" x="411.6104" y="327.4482">merge(nums,&#160;lo,&#160;mid,&#160;hi)</text><text fill="#000000" font-family="monospace" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="377.8955" y="343.7451">}</text><path d="M317.8955,273.7109 L327.8955,273.7109 C342.895